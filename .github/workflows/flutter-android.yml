name: CrazeChat Flutter Android
on:
  push:
    branches: [main, feature/flutter-crazechat-client]
  pull_request:
    branches: [main, feature/flutter-crazechat-client]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold if needed
        run: flutter create --platforms=android --org com.crazestudio --project-name crazechat .

      - name: Ensure Android internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest was not generated: {manifest}")

          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>'
          if 'android.permission.INTERNET' not in content:
              content = re.sub(
                  r'(<manifest\\b[^>]*>)',
                  r'\\1\\n' + permission,
                  content,
                  count=1,
              )
              manifest.write_text(content)
          print("INTERNET permission present in main Android manifest.")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        env:
          CRAZECHAT_INSTALLATION_ID: ${{ secrets.CRAZECHAT_INSTALLATION_ID }}
        run: flutter build apk --release --dart-define=CRAZECHAT_API_BASE_URL=https://crazechat-api.vercel.app --dart-define=CRAZECHAT_INSTALLATION_ID="$CRAZECHAT_INSTALLATION_ID"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
