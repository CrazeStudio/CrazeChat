name: CrazeChat Android CI

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/crazechat-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/crazechat-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.crazestudio --project-name crazechat .
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run regression tests
        run: flutter test --no-pub
      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          CRAZECHAT_API_BASE_URL: ${{ vars.CRAZECHAT_API_BASE_URL }}
        run: |
          API_BASE_URL="${CRAZECHAT_API_BASE_URL:-https://crazechat-api.vercel.app}"
          flutter build apk --release --no-pub \
            --dart-define=CRAZECHAT_API_BASE_URL="$API_BASE_URL"
      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
