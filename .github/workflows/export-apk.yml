name: Export CrazeChat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".env.example"
      - ".github/workflows/export-apk.yml"

permissions:
  contents: write

concurrency:
  group: crazechat-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local debug signing key
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Build APK
        env:
          CRAZECHAT_API_BASE_URL: https://crazechat-api.vercel.app
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p Apk_Download
          cp app/build/outputs/apk/debug/*.apk Apk_Download/CrazeChat-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apk_Download/CrazeChat-debug.apk

          if git diff --cached --quiet; then
            echo "APK is unchanged; no commit needed."
            exit 0
          fi

          git commit -m "Update CrazeChat debug APK"
          git push origin HEAD:main
