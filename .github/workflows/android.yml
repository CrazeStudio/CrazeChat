name: CrazeChat Android Gradle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CRAZECHAT_BURL: ${{ secrets.BURL || 'https://crazestudio-web.mehetabhoque566.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("app/google-services.json").read_text())
          assert config["project_info"]["project_id"] == "gothic-sylph-454303-k5"
          clients = [
              item for item in config["client"]
              if item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.crazestudio.crazechat"
          ]
          assert len(clients) == 1
          print("Firebase Android app configuration validated.")
          PY
          test -n "$CRAZECHAT_BURL"
          case "$CRAZECHAT_BURL" in https://*) ;; *) echo "::error::CRAZECHAT_BURL must use HTTPS"; exit 1 ;; esac

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify native shared library is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libcraze.so'
          echo "libcraze.so is packaged; the client requires no shared gateway secret."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-native-android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
