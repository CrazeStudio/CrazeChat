name: CrazeChat Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: bash tool/prepare_android.sh

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Test authenticated backend and CloudPurge lifecycle
        working-directory: backend
        run: |
          npm install --include=dev
          npm test

      - name: Build release APK
        if: ${{ secrets.API_URL != '' }}
        env:
          CRAZECHAT_API_URL: ${{ secrets.API_URL }}
        run: |
          flutter build apk --release \
            --dart-define="API_URL=$CRAZECHAT_API_URL"

      - name: Report API deployment requirement
        if: ${{ secrets.API_URL == '' }}
        run: echo "::warning::Backend tests passed; set the API_URL repository secret to build a connected release APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
