name: CrazeChat Android CI

on:
  push:
    branches: [backup/flutter-app]
  pull_request:
    branches: [backup/flutter-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pinned Firebase Android configuration
        env:
          EXPECTED_SHA256: fd8befced9cd8f072af74908b218ffd878a6c40f798bf93241fcfc8cce1ea95a
        run: |
          set -euo pipefail
          CONFIG="android/app/google-services.json"
          test -s "$CONFIG"
          ACTUAL_SHA256="$(sha256sum "$CONFIG" | cut -d ' ' -f 1)"
          echo "Firebase config SHA-256: $ACTUAL_SHA256"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::google-services.json fingerprint mismatch. Refusing to build."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          assert config["project_info"]["project_id"] == "gothic-sylph-454303-k5"
          assert config["project_info"]["firebase_url"] == "https://gothic-sylph-454303-k5-default-rtdb.firebaseio.com"
          matches = [
              c for c in config["client"]
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.crazestudio.crazechat"
          ]
          assert len(matches) == 1, "Expected exactly one CrazeChat Android app entry"
          print("Firebase project and Android package identity verified.")
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: bash tool/prepare_android.sh

      - name: Verify Android security policy
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import re
          from pathlib import Path

          android_ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          application = manifest.find("application")
          assert application is not None, "Android application tag missing"
          assert application.get(android_ns + "allowBackup") == "false"
          assert application.get(android_ns + "usesCleartextTraffic") == "false"
          assert application.get(android_ns + "networkSecurityConfig") == "@xml/network_security_config"

          policy = ET.parse("android/app/src/main/res/xml/network_security_config.xml").getroot()
          base = policy.find("base-config")
          assert base is not None and base.get("cleartextTrafficPermitted") == "false"
          domains = {node.text for node in policy.findall(".//domain")}
          assert domains == {"localhost", "127.0.0.1", "10.0.2.2"}
          gradle = Path("android/app/build.gradle.kts").read_text()
          assert re.search(r"\bminSdk\s*=\s*24\b", gradle), "Network policy requires minSdk 24+"
          assert "externalNativeBuild" in gradle, "Native config library is not wired into Gradle"
          print("Android backup is disabled; cleartext is denied except explicit local development hosts.")
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK (verifies the native config library compiles)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Detect API configuration
        id: app_config
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL || 'https://crazestudio-web.mehetabhoque566.workers.dev' }}
          CRAZECHAT_KEY: ${{ secrets.KEY }}
        run: |
          if [[ "$CRAZECHAT_BURL" == https://* && -n "$CRAZECHAT_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate native API config
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'true'
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL || 'https://crazestudio-web.mehetabhoque566.workers.dev' }}
          CRAZECHAT_KEY: ${{ secrets.KEY }}
        run: python3 tool/gen_native_config.py

      - name: Prepare release signing (optional)
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/crazechat-release.jks"
            {
              echo "CRAZECHAT_KEYSTORE_PATH=$RUNNER_TEMP/crazechat-release.jks"
              echo "CRAZECHAT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CRAZECHAT_KEY_ALIAS=$KEY_ALIAS"
              echo "CRAZECHAT_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Release keystore found: the APK will be signed with it."
          else
            echo "::warning::No release keystore secrets set; the APK is signed with a temporary debug key, so every build has a different signature."
          fi

      - name: Build release APK
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'true'
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL || 'https://crazestudio-web.mehetabhoque566.workers.dev' }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define="BURL=$CRAZECHAT_BURL"

      - name: Verify the access key is not stored in plain text
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'true'
        env:
          CRAZECHAT_KEY: ${{ secrets.KEY }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libcrazecfg.so'
          rm -rf "$RUNNER_TEMP/apklibs"
          unzip -q "$APK" 'lib/*' -d "$RUNNER_TEMP/apklibs"
          if grep -rFl -- "$CRAZECHAT_KEY" "$RUNNER_TEMP/apklibs"; then
            echo "::error::The access key appears in plain text inside the APK libraries."
            exit 1
          fi
          echo "Native config library present; key not found as plain text."

      - name: Report API configuration requirement
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'false'
        run: echo "::warning::Set the KEY repository secret to the exact backend ACCESS_KEY value. BURL must be the HTTPS CrazeStudio-Web origin."

      - name: Upload APK
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug symbols (needed to read obfuscated crash traces)
        if: github.ref == 'refs/heads/main' && steps.app_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-debug-symbols
          path: build/symbols
