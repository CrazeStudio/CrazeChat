name: CrazeChat Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: bash tool/prepare_android.sh
      - name: Install packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Check app configuration secrets
        id: app_config
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL }}
          CRAZECHAT_KEY: ${{ secrets.KEY }}
        run: |
          if [[ -n "$CRAZECHAT_BURL" && -n "$CRAZECHAT_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::APK build requires repository secrets BURL and KEY."
            exit 1
          fi
      - name: Build release APK
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL }}
          CRAZECHAT_KEY: ${{ secrets.KEY }}
        run: |
          flutter build apk --release \
            --dart-define="BURL=$CRAZECHAT_BURL" \
            --dart-define="KEY=$CRAZECHAT_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-android-release
          path: build/app/outputs/flutter-apk/app-release.apk