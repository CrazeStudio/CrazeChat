name: CrazeChat Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: bash tool/prepare_android.sh

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Test authenticated backend and CloudPurge lifecycle
        working-directory: backend
        run: |
          npm install --include=dev
          npm test

      - name: Detect API URL configuration
        id: app_config
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL }}
        run: |
          if [[ "$CRAZECHAT_BURL" == https://* ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.app_config.outputs.configured == 'true'
        env:
          CRAZECHAT_BURL: ${{ secrets.BURL }}
        run: |
          flutter build apk --release \
            --dart-define="BURL=$CRAZECHAT_BURL"

      - name: Report API deployment requirement
        if: steps.app_config.outputs.configured == 'false'
        run: echo "::warning::Backend tests passed; set the BURL repository secret to build a connected release APK."

      - name: Upload APK
        if: steps.app_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crazechat-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
