services:
  - type: web
    name: crazechat-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: API_TOKEN_SIGNING_SECRET
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"